<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>カレー屋のネット注文</title>
    <link th:href="@{/css/bootstrap.css}" rel="stylesheet" />
    <link th:href="@{/css/curry.css}" href="../../static/css/curry.css" rel="stylesheet" />
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="container">
      <div th:insert="header::header">
      </div>

        <div class="row" th:if="${stockError}">
        <div class="col-xs-offset-1 col-xs-10">
          <div class="alert alert-danger text-center" style="margin-top: 20px;">
            <h4 th:text="${stockError}" style="font-weight: bold;"></h4>
            <p>大変お手数ですが、一度内容をご確認の上、商品を選び直してください。</p>
            
            <div style="margin-top: 15px;">
              <a th:href="@{/showList}" class="btn btn-warning btn-lg" style="color: #000; font-weight: bold;">
                商品一覧に戻って選び直す
              </a>
            </div>
          </div>
        </div>
      </div>
      <!-- table -->
      <div class="row">
        <div
          class="
            table-responsive
            col-lg-offset-1
            col-lg-10
            col-md-offset-1
            col-md-10
            col-sm-10
            col-xs-12
          "
        >
          <h3 class="text-center">注文内容確認</h3>
          <table class="table table-striped item-list-table">
            <tbody>
              <tr>
                <th>
                  <div class="text-center">商品名</div>
                </th>
                <th>
                  <div class="text-center">サイズ、価格(税込み)、数量</div>
                </th>
                <th>
                  <div class="text-center">トッピング、価格(税込み)</div>
                </th>
                <th>
                  <div class="text-center">小計</div>
                </th>
              </tr>
              <tr th:each="cart:${session.cartItemList}">
                <td>
                    <div class="item-overlay-container">
                      <img
                        th:src="@{/img_curry/}+${cart.imagePath}"
                        class="img-responsive img-rounded item-img-center"
                        width="100"
                      />
                      <img th:each="topping, toppingStatus : ${cart.toppingList}"
                           th:src="@{/img_curry/toppings/topping_} + ${topping.id} + '.png'"
                           class="topping-overlay"
                           th:style="'top:' + (${topping.id == 14 || topping.id == 22 ? '20%' : (15 + ((toppingStatus.index * 17) % 45)) + '%'}) + ';' +
                                     'left:' + (${topping.id == 14 || topping.id == 22 ? '10%' : (10 + ((toppingStatus.index * 23) % 45)) + '%'}) + ';' +
                                     'width:' + (${topping.id == 14 || topping.id == 22 ? '75%' : '30%'}) + ';'"
                      />
                    </div><br />
                    <span th:text="${cart.name}"></span>
                </td>
                <td>
                  <span th:text="${cart.size}" class="price">&nbsp;Ｌ</span>
                  
                  &nbsp;&nbsp;<span th:text="${#numbers.formatInteger(cart.itemPrice,1,'COMMA')}+'円'"></span>
                  &nbsp;&nbsp;<span th:text="${cart.quantity}+'個'"></span>
                </td>
                <td>
                  <ul th:each="topping:${cart.toppingList}">
                    <li th:if="${cart.size=='M'}" th:text="${topping.name}+${topping.priceM}+'円'" >ピーマン300円</li>
                    <li th:if="${cart.size=='L'}" th:text="${topping.name}+${topping.priceL}+'円'" >ピーマン300円</li>
                  </ul>
                </td>
                <td>
                  <div class="text-center" th:text="${#numbers.formatInteger(cart.subTotal,1,'COMMA')}+'円'"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="row">
        <div class="col-xs-offset-2 col-xs-8">
          <div class="form-group text-center">
            <span id="total-price">消費税：
            <span th:text="${#numbers.formatInteger(session.totalPrice*0.1,1,'COMMA')}"></span>円</span><br />
            <span id="total-price">ご注文金額合計：
            <span th:text="${#numbers.formatInteger(session.totalPrice,1,'COMMA')}"></span>円 (税込み)</span>
          </div>
        </div>
      </div>

      <!-- table -->
      <form action="order_finished.html" th:action="@{/order}" th:object="${orderForm}" method="post">
      <input type="hidden" name="totalPrice" th:value="${session.totalPrice}"> 
        <div class="row">
          <div
            class="
              table-responsive
              col-lg-offset-3
              col-lg-6
              col-md-offset-1
              col-md-10
              col-sm-10
              col-xs-12
            "
          >
            <h3 class="text-center">お届け先情報</h3>
            <table class="table table-striped item-list-table">
              <tbody>
                <tr>
                  <td>
                    <div class="text-center">
                      <label for="name" class="normal-label">お名前</label>
                    </div>
                  </td>
                  <td>
                  	<label th:errors="*{destinationName}" class="control-label" style="color: red" for="destinationName"></label>
                    <input th:field="*{destinationName}" type="text" name="destinationName" placeholder="山田太郎" id="name" style="display: block;"/>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="text-center">
                      <label for="email" class="normal-label">メールアドレス</label>
                    </div>
                  </td>
                  <td>
                  	<label th:errors="*{destinationEmail}" class="control-label" style="color: red" for="destinationEmail"></label>
                    <input th:field="*{destinationEmail}" type="text" placeholder="xxx@xxx" name="destinationEmail" id="email" style="display: block;"/>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="text-center normal-label" >
                      <label for="zipCode" class="normal-label">郵便番号</label>
                    </div>
                  </td>
                  <td>
					<label th:errors="*{destinationZipcode}" class="control-label" style="color: red" for="zipcode"></label>
					<input th:field="*{destinationZipcode}" name="destinationZipcode" id="destinationZipcode" type="text" size="20" placeholder="279-0031" style="display: block;"/>
           			<button id="get_address_btn" type="button">住所検索</button>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="text-center" >
                      <label for="address" class="normal-label">住所</label>
                    </div>
                  </td>
                  <td>
                  	<label th:errors="*{destinationAddress}" class="control-label" style="color: red" for="address"></label>
                    <input th:field="*{destinationAddress}" name="destinationAddress" id="address" type="text" size="50" placeholder="千葉県浦安市舞浜１−１" style="display: block;"/>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="text-center">
                      <label for="phoneNumber" class="normal-label">電話番号</label>
                    </div>
                  </td>
                  <td>
                  	<label th:errors="*{destinationTel}" class="control-label" style="color: red" for="destinationTel"></label>
                    <input th:field="*{destinationTel}" type="text" name="destinationTel" id="phoneNumber" placeholder="000-000-0000" style="display: block;"/>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="text-center">配達日時</div>
                  </td>
                  <td>
                    <div class="form-group">
                      <div class="row">
                        <div class="col-sm-12">
                          <label th:if="${errorDeliveryDate != null}" th:text="#{${errorDeliveryDate}}" class="control-label" style="color: red" for="inputPeriod">

                          配達日時を入力してください</label>
                        </div>
                        <div class="col-sm-5">
                          <input
                            type="date"
                            name="orderDate"
                            th:field="${orderForm.orderDate}"
                            id="orderDate"
                            class="form-control input-sm"
                          />
                        </div>
                      </div>
                      <div class="row">
                        <div class="col-sm-12">
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="10"/>
                            10時
                          </label>
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="11"/>
                            11時
                          </label>
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="12"/>
                            12時 </label
                          ><br />
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="13"/>
                            13時
                          </label>
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="14"/>
                            14時
                          </label>
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="15"/>
                            15時 </label
                          ><br />
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="16"/>
                            16時
                          </label>
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="17"/>
                            17時
                          </label>
                          <label class="radio-inline">
                            <input type="radio" th:field="*{deliveryTime}" value="18"/>
                            18時 </label
                          ><br />
                        </div>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- table -->
        <div class="row">
          <div
            class="
              table-responsive
              col-lg-offset-3
              col-lg-6
              col-md-offset-1
              col-md-10
              col-sm-10
              col-xs-12
            "
          >
            <h3 class="text-center">お支払い方法</h3>
            <table class="table table-striped item-list-table">
              <tbody>
                <tr>
                  <td>
                    <div class="text-center">代金引換</div>
                  </td>
                  <td>
                    <div class="row">
                      <div class="col-sm-12">
                        <label class="radio-inline">
                          <input
                            type="radio"
                            name="paymentMethod"
                            value="1"
                            checked="checked"
                          />
                          代金引換
                        </label>
                      </div>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>
                    <div class="text-center">クレジットカード決済</div>
                  </td>
                  <td align="center">
                    <div class="row">
                      <div class="col-sm-12">
                        <label class="radio-inline">
                          <input
                            type="radio"
                            name="paymentMethod"
                            value="2"
                            checked="checked"
                          />
                          クレジットカード </label
                        ><br /><br />
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="row text-center">
          <div class="col-xs-12">
            <div class="form-group">
              <input
                class="btn btn-warning btn-lg"
                type="submit"
                value="この内容で注文する"
              />
            </div>
          </div>
        </div>
      </form>
    </div>
    <!-- end container -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/get_address.js}"></script>
  </body>
</html>
