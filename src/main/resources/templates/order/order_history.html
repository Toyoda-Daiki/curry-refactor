<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>カレー屋のネット注文</title>
    <link th:href="@{/css/bootstrap.css}" href="../../static/css/bootstrap.css" rel="stylesheet" />
    <link th:href="@{/css/curry.css}" href="../../static/css/curry.css" rel="stylesheet" />
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <div class="container">
	<span th:insert="header::header"></span>
      
      	
        <div class="row">
          <div class= "col-xs-12">
          	<!-- table -->
      	<div class="row">
        <div
          class="
            table-responsive
            col-lg-offset-1
            col-lg-10
            col-md-offset-1
            col-md-10
            col-sm-10
            col-xs-12
          "
        >
        <h3 class="text-center">注文一覧</h3>
        <br>
        <div class="text-center">
          <h3 th:if="${orderNothing != null}" th:text="${orderNothing}"></h3>
        </div>
        <div >
          <table class="table table-striped item-list-table">
            <tbody th:each="orders: ${orderList}">
              <tr>
                <th colspan="8">
                  <label>お届け日：</label>
                  <span th:text="${orders.orderDate}"></span>
                </th>
                <th></th>
                <th></th>
                <th></th>
                
                
                <th colspan="6">
                <label>合計金額：</label>
                  <span th:text="${#numbers.formatInteger(orders.totalPrice,1,'COMMA')}"></span>円
                </th>
                <th colspan="5">
                	<a th:href="@{'/orderdetail?id=' + ${orders.id}}">注文詳細はこちら</a>
                </th>
                
              </tr>
              
              <tr>
              	<th colspan="8">
              		<label> イメージ</label>
              	</th>
              	<th colspan="3">
              		<label>商品名</label>
              	</th>
              	<th colspan="6">
              		<label>トッピング</label>
              	</th>
              	<th colspan="5">
              		<label>詳細</label>
              	</th>
              </tr>
              
             
              <tr th:each="orderItem : ${orders.orderItemList}">
                
                <th colspan="8">
                  <a th:href="@{'/detail?id=' + ${orderItem.item.id}}">
                    <div class="item-overlay-container">
                      <img th:src="@{/img_curry/} + ${orderItem.item.imagePath}" style="max-width: 100%; height: auto;"></img>
                      <img th:each="orderTopping, toppingStatus : ${orderItem.orderTopping}"
                           th:if="${orderTopping.topping != null && orderTopping.topping.id != null}"
                           th:src="@{/img_curry/toppings/topping_} + ${orderTopping.topping.id} + '.png'"
                           class="topping-overlay"
                           th:style="'top:' + (${orderTopping.topping.id == 14 || orderTopping.topping.id == 22 ? '20%' : (15 + ((toppingStatus.index * 17) % 45)) + '%'}) + ';' +
                                     'left:' + (${orderTopping.topping.id == 14 || orderTopping.topping.id == 22 ? '10%' : (10 + ((toppingStatus.index * 23) % 45)) + '%'}) + ';' +
                                     'width:' + (${orderTopping.topping.id == 14 || orderTopping.topping.id == 22 ? '75%' : '30%'}) + ';'"
                      />
                    </div>
                  </a>
                </th>
                
                <th colspan="3">
                  
                  <span th:text="${orderItem.item.name}"></span>
                </th>
                
                <th colspan="6">
                	<label></label><br>
                	<span th:each="orderTopping : ${orderItem.orderTopping}">
                		<span th:if="${orderTopping.topping.name == null}">なし</span>
                		<span th:text="・ + ${orderTopping.topping.name}"></span><br>
                	</span>
                </th>
                <th colspan="5">
                  <label>サイズ：</label>
                  <span th:text="${orderItem.size}"></span><br>
                  <label>個数：</label>
                  <span th:text="${orderItem.quantity}"></span>個<br>
                  <label>小計(税抜き)：</label>
                  <span th:text="${#numbers.formatInteger(orderItem.subTotalBeforeTax,1,'COMMA')}"></span>円<br>
                </th>
               
                
              </tr>
              <tr>
              	<th colspan="22">&nbsp;</th>
              </tr>
            </tbody>
          </table>
         </div> 
            
            
          </div>
        </div>
        </div>
        </div>
      
    </div>
    <!-- end container -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
	<script type="text/javascript" src="js/item_deail.js"></script>
    <script src="/js/bootstrap.min.js" th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
